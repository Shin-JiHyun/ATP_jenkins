apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: sjh
  name: front-canary-a
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80