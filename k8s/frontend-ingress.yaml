apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: sjh
  name: frontend-ingress-v{version}
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service-v{version}
            port:
              number: 80